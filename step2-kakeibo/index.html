<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ごま家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  /* レイアウト: 1列の帳簿。上から 月の合計 → 記帳フォーム（レシート読み取り付き）→ カテゴリ内訳 → 明細 */
  :root {
    --paper: #f3f5f4;
    --sheet: #ffffff;
    --ink: #1d2a2e;
    --muted: #63727a;
    --rule: #d9e1e1;
    --ai: #24508f;          /* 藍: 操作の色 */
    --ai-soft: #e3eaf5;
    --shu: #c8442f;         /* 朱: 支出の数字にだけ使う */
    --c-food: #d98a2b; --c-daily: #3f9a8a; --c-move: #4f74c9;
    --c-fun: #b05bb0; --c-home: #7c8a3a; --c-other: #8d8f93;
    --f-display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121a1d; --sheet: #1a2428; --ink: #e5ecec; --muted: #94a3a8; --rule: #2b393e;
      --ai: #8fb0ea; --ai-soft: #22324a; --shu: #f08a74; color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--f-body); font-size: 15px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(20px, env(safe-area-inset-top, 0px)) max(56px, env(safe-area-inset-bottom, 0px));
  }
  main, .login { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ログイン */
  .brand { font-family: var(--f-display); font-size: 1.6rem; margin: 24px 0 0; }
  .lead { color: var(--muted); margin: 0; }

  /* 上部 */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); }
  .topbar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .month { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .month h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .04em; }
  .icon-btn {
    border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
    width: 40px; height: 40px; border-radius: 10px; font-size: 1.1rem; cursor: pointer;
  }
  .total { display: grid; gap: 2px; }
  .total .label { color: var(--muted); font-size: .8rem; letter-spacing: .08em; }
  .total .yen { font-family: var(--f-display); font-size: clamp(2.2rem, 10vw, 3rem); line-height: 1.1; color: var(--shu); }
  .total .yen small { font-size: .5em; margin-right: 2px; }
  .total .sub { color: var(--muted); font-size: .85rem; }

  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .sheet h2 { margin: 0; font-size: .8rem; color: var(--muted); letter-spacing: .1em; font-weight: 500; }

  /* レシート読み取り */
  .scan {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    border: 1.5px dashed var(--ai); border-radius: 12px; padding: 14px; background: var(--ai-soft); color: var(--ai);
    font: inherit; font-weight: 700; cursor: pointer; width: 100%;
  }
  .scan svg { width: 22px; height: 22px; flex: none; }
  .scan[aria-busy="true"] { opacity: .7; cursor: progress; }
  .scan-status { margin: 0; font-size: .85rem; color: var(--ai); }
  .scan-status.bad { color: var(--shu); }

  /* 記帳フォーム */
  form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .amount-row { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
  .amount-row span { font-family: var(--f-display); font-size: 1.4rem; }
  #amount {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font-family: var(--f-display); font-size: 1.8rem; padding: 0; outline: none;
  }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
  .cats label { position: relative; }
  .cats input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .cats span {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--rule); font-size: .9rem; cursor: pointer;
  }
  .cats span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
  .cats input:checked + span { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); font-weight: 700; }
  .cats input:focus-visible + span { outline: 2px solid var(--ai); outline-offset: 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 9.5rem; gap: 8px; }
  .field { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: inherit; background: var(--paper); color: var(--ink); min-width: 0; width: 100%; }
  .field:focus-visible, #amount:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .submit {
    border: 0; border-radius: 10px; padding: 12px; background: var(--ai); color: var(--sheet);
    font: inherit; font-weight: 700; letter-spacing: .1em; cursor: pointer;
  }
  .submit:disabled { opacity: .6; cursor: progress; }
  .submit:focus-visible, .icon-btn:focus-visible, .del:focus-visible, .link:focus-visible, .scan:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .error { color: var(--shu); font-size: .85rem; margin: 0; }
  .note { color: var(--muted); font-size: .85rem; margin: 0; }

  /* カテゴリ内訳 */
  .bars { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
  .bar-head .pct { color: var(--muted); font-size: .8rem; margin-left: 6px; }
  .track { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--dot); border-radius: 4px; }

  /* 明細 */
  .day { display: grid; gap: 0; }
  .day-head { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .item { display: grid; grid-template-columns: 10px 1fr auto 36px; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--rule); }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
  .item .what { min-width: 0; }
  .item .what b { font-weight: 500; display: block; overflow-wrap: anywhere; }
  .item .what small { color: var(--muted); font-size: .78rem; }
  .item .amt { font-weight: 700; }
  .del { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }
  .del:hover { background: var(--paper); color: var(--shu); }
  .empty { color: var(--muted); font-size: .9rem; margin: 0; }
  .link { border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 14px;
    display: flex; gap: 14px; align-items: center; font-size: .9rem; max-width: calc(100% - 32px);
  }
  .toast .link { color: var(--paper); font-weight: 700; }
  @media (prefers-reduced-motion: no-preference) { .fill { transition: width .35s ease; } }
</style>
</head>
<body>

<!-- 設定エラー / ログイン -->
<section class="login" id="login-view" hidden>
  <p class="brand">ごま家計簿</p>
  <p class="lead" id="login-lead">メールアドレスにログイン用のリンクを送ります。パスワードはいりません。</p>
  <form id="login-form" class="sheet" novalidate>
    <input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com" aria-label="メールアドレス">
    <p class="error" id="login-error" hidden></p>
    <button class="submit" type="submit">ログインリンクを送る</button>
  </form>
</section>

<main id="app-view" hidden>
  <div class="topbar">
    <span id="who"></span>
    <button class="link" id="logout" type="button">ログアウト</button>
  </div>

  <div class="month">
    <button class="icon-btn" id="prev" type="button" aria-label="前の月">‹</button>
    <h1 id="month-label"></h1>
    <button class="icon-btn" id="next" type="button" aria-label="次の月">›</button>
  </div>

  <section class="total" aria-live="polite">
    <span class="label">この月の支出</span>
    <span class="yen num" id="total"></span>
    <span class="sub" id="total-sub"></span>
  </section>

  <section class="sheet" aria-labelledby="form-title">
    <h2 id="form-title">記帳する</h2>
    <button class="scan" id="scan" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 9h8M8 12h8M8 15h5"/>
      </svg>
      レシートを撮って読み取る
    </button>
    <input id="photo" type="file" accept="image/*" capture="environment" hidden>
    <p class="scan-status" id="scan-status" role="status" hidden></p>
    <form id="form" novalidate>
      <div class="amount-row">
        <span>¥</span>
        <input id="amount" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="金額">
      </div>
      <fieldset class="cats" id="cats" aria-label="カテゴリ"></fieldset>
      <div class="row2">
        <input class="field" id="memo" placeholder="メモ（例: ランチ）" maxlength="40" aria-label="メモ">
        <input class="field" id="date" type="date" aria-label="日付">
      </div>
      <p class="error" id="error" hidden></p>
      <button class="submit" id="save" type="submit">記帳する</button>
    </form>
  </section>

  <section class="sheet" aria-labelledby="bars-title">
    <h2 id="bars-title">カテゴリ別</h2>
    <ul class="bars" id="bars"></ul>
  </section>

  <section class="sheet" aria-labelledby="list-title">
    <h2 id="list-title">明細</h2>
    <div id="list"><p class="empty">読み込み中…</p></div>
  </section>
</main>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button class="link" id="undo" type="button">元に戻す</button>
</div>

<script>
  const CATS = [
    { id: "food",  name: "食費",   color: "var(--c-food)" },
    { id: "daily", name: "日用品", color: "var(--c-daily)" },
    { id: "move",  name: "交通",   color: "var(--c-move)" },
    { id: "fun",   name: "趣味",   color: "var(--c-fun)" },
    { id: "home",  name: "住まい", color: "var(--c-home)" },
    { id: "other", name: "その他", color: "var(--c-other)" },
  ];
  const catOf = (id) => CATS.find((c) => c.id === id) || CATS[CATS.length - 1];
  const yen = (n) => n.toLocaleString("ja-JP");
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
  const $ = (id) => document.getElementById(id);

  let db;               // Supabase クライアント
  let session = null;
  let rows = [];        // 表示中の月の明細
  const today = new Date();
  let view = { y: today.getFullYear(), m: today.getMonth() }; // m: 0-11
  let lastDeleted = null;
  let toastTimer;

  $("date").value = ymd(today);
  $("cats").innerHTML = CATS.map((c, i) => `
    <label style="--dot:${c.color}">
      <input type="radio" name="cat" id="cat-${c.id}" value="${c.id}" ${i === 0 ? "checked" : ""}>
      <span>${c.name}</span>
    </label>`).join("");

  function setCat(id) {
    const input = document.getElementById("cat-" + id);
    if (input) input.checked = true;
  }

  // ---------- 起動とログイン ----------
  async function boot() {
    let config;
    try {
      const r = await fetch("/api/config");
      config = await r.json();
      if (!r.ok) throw new Error(config.error);
    } catch (e) {
      $("login-view").hidden = false;
      $("login-form").hidden = true;
      $("login-lead").textContent = "設定が終わっていません: " + (e.message || "サーバーに接続できません。") + " SETUP.md の手順を確認してください。";
      return;
    }
    db = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
    const { data } = await db.auth.getSession();
    onSession(data.session);
    db.auth.onAuthStateChange((_event, s) => onSession(s));
  }

  function onSession(s) {
    const changed = (s?.user?.id || null) !== (session?.user?.id || null);
    session = s;
    $("login-view").hidden = !!s;
    $("app-view").hidden = !s;
    if (s) {
      $("who").textContent = s.user.email;
      if (changed) load();
    }
  }

  $("login-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const email = $("email").value.trim();
    const err = $("login-error");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      err.textContent = "メールアドレスの形が正しくありません。";
      err.hidden = false; return;
    }
    const { error } = await db.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin } });
    if (error) {
      err.textContent = "送れませんでした: " + error.message;
      err.hidden = false; return;
    }
    err.hidden = true;
    $("login-lead").textContent = `${email} にリンクを送りました。メールを開いてリンクを押すとログインできます。`;
    $("login-form").hidden = true;
  });

  $("logout").addEventListener("click", () => db.auth.signOut());

  // ---------- データの読み書き ----------
  async function load() {
    const first = `${view.y}-${pad(view.m + 1)}-01`;
    const last = ymd(new Date(view.y, view.m + 1, 0));
    const { data, error } = await db.from("entries")
      .select("id, date, amount, cat, memo, created_at")
      .gte("date", first).lte("date", last)
      .order("date", { ascending: false }).order("created_at", { ascending: false });
    if (error) {
      $("list").innerHTML = "";
      const p = document.createElement("p");
      p.className = "error";
      p.textContent = "明細を読み込めませんでした: " + error.message;
      $("list").appendChild(p);
      return;
    }
    rows = data;
    render();
  }

  async function remove(entry) {
    const { error } = await db.from("entries").delete().eq("id", entry.id);
    if (error) { showToast("削除できませんでした: " + error.message, false); return; }
    lastDeleted = entry;
    rows = rows.filter((e) => e.id !== entry.id);
    render();
    showToast(`「${entry.memo || catOf(entry.cat).name}」を削除しました`, true);
  }

  $("undo").addEventListener("click", async () => {
    if (!lastDeleted) return;
    const { id, date, amount, cat, memo } = lastDeleted;
    lastDeleted = null;
    $("toast").hidden = true;
    const { error } = await db.from("entries").insert({ id, date, amount, cat, memo });
    if (error) { showToast("元に戻せませんでした: " + error.message, false); return; }
    load();
  });

  function showToast(text, undoable) {
    $("toast-text").textContent = text;
    $("undo").hidden = !undoable;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ($("toast").hidden = true), 5000);
  }

  // ---------- 表示 ----------
  function render() {
    $("month-label").textContent = `${view.y}年${view.m + 1}月`;
    const total = rows.reduce((s, e) => s + e.amount, 0);
    $("total").innerHTML = `<small>¥</small>${yen(total)}`;
    $("total-sub").textContent = rows.length ? `${rows.length}件の支出` : "まだ記帳がありません";

    const sums = CATS.map((c) => ({ c, sum: rows.filter((e) => e.cat === c.id).reduce((s, e) => s + e.amount, 0) }))
      .filter((x) => x.sum > 0).sort((a, b) => b.sum - a.sum);
    const max = sums[0]?.sum || 1;
    $("bars").innerHTML = sums.length ? sums.map(({ c, sum }) => `
      <li style="--dot:${c.color}">
        <div class="bar-head"><span>${c.name}<span class="pct num">${Math.round((sum / total) * 100)}%</span></span><span class="num">¥${yen(sum)}</span></div>
        <div class="track"><div class="fill" style="width:${(sum / max) * 100}%"></div></div>
      </li>`).join("") : `<li class="empty">記帳するとここにカテゴリごとの合計が出ます。</li>`;

    const list = $("list");
    list.innerHTML = "";
    if (!rows.length) {
      list.innerHTML = `<p class="empty">この月の明細はありません。レシートを撮るか、上のフォームから記帳できます。</p>`;
      return;
    }
    const byDay = {};
    rows.forEach((e) => (byDay[e.date] ||= []).push(e));
    Object.entries(byDay).forEach(([date, items]) => {
      const d = new Date(date + "T00:00:00");
      const block = document.createElement("div");
      block.className = "day";
      const head = document.createElement("div");
      head.className = "day-head";
      head.innerHTML = `<span>${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）</span><span class="num">¥${yen(items.reduce((s, e) => s + e.amount, 0))}</span>`;
      block.appendChild(head);
      items.forEach((e) => {
        const c = catOf(e.cat);
        const row = document.createElement("div");
        row.className = "item";
        row.style.setProperty("--dot", c.color);
        row.innerHTML = `<span class="dot"></span><span class="what"><b></b><small></small></span><span class="amt num"></span><button class="del" type="button">×</button>`;
        row.querySelector("b").textContent = e.memo || c.name;
        row.querySelector("small").textContent = c.name;
        row.querySelector(".amt").textContent = "¥" + yen(e.amount);
        const del = row.querySelector(".del");
        del.setAttribute("aria-label", `${e.memo || c.name} ¥${yen(e.amount)} を削除`);
        del.addEventListener("click", () => remove(e));
        block.appendChild(row);
      });
      list.appendChild(block);
    });
  }

  // ---------- 記帳 ----------
  // 全角数字やカンマも受け付ける
  function parseAmount(s) {
    const n = s.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)).replace(/[,，\s円¥￥]/g, "");
    return /^\d+$/.test(n) ? Number(n) : NaN;
  }

  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const amount = parseAmount($("amount").value);
    const err = $("error");
    if (!amount || amount < 1 || amount >= 100000000) {
      err.textContent = "金額を1円以上の数字で入れてください。";
      err.hidden = false; $("amount").focus(); return;
    }
    if (!$("date").value) {
      err.textContent = "日付を選んでください。";
      err.hidden = false; return;
    }
    err.hidden = true;
    const entry = {
      date: $("date").value,
      amount,
      cat: document.querySelector('input[name="cat"]:checked').value,
      memo: $("memo").value.trim(),
    };
    $("save").disabled = true;
    const { error } = await db.from("entries").insert(entry);
    $("save").disabled = false;
    if (error) {
      err.textContent = "保存できませんでした: " + error.message;
      err.hidden = false; return;
    }
    const [y, m] = entry.date.split("-").map(Number);
    view = { y, m: m - 1 };
    $("amount").value = ""; $("memo").value = "";
    $("scan-status").hidden = true;
    load();
  });

  // ---------- レシート読み取り ----------
  $("scan").addEventListener("click", () => $("photo").click());

  // スマホの写真は大きいので、長い辺 1600px の JPEG に縮めてから送る
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.85).split(",")[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("この画像は開けませんでした。")); };
      img.src = url;
    });
  }

  function scanStatus(text, bad) {
    const el = $("scan-status");
    el.textContent = text;
    el.classList.toggle("bad", !!bad);
    el.hidden = false;
  }

  $("photo").addEventListener("change", async () => {
    const file = $("photo").files[0];
    $("photo").value = "";
    if (!file) return;
    const btn = $("scan");
    btn.setAttribute("aria-busy", "true");
    btn.disabled = true;
    scanStatus("読み取り中です…（10秒ほどかかります）");
    try {
      const image = await shrink(file);
      const r = await fetch("/api/scan-receipt", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token },
        body: JSON.stringify({ image, mediaType: "image/jpeg", today: ymd(new Date()) }),
      });
      const result = await r.json();
      if (!r.ok) throw new Error(result.error || "読み取りに失敗しました。");
      $("amount").value = yen(result.total);
      if (result.date) $("date").value = result.date;
      $("memo").value = result.store;
      setCat(result.category);
      scanStatus(`読み取りました: ${result.store || "お店不明"} ¥${yen(result.total)}。内容を確かめて「記帳する」を押してください。`);
    } catch (e) {
      scanStatus(e.message, true);
    } finally {
      btn.removeAttribute("aria-busy");
      btn.disabled = false;
    }
  });

  $("prev").addEventListener("click", () => { view.m--; if (view.m < 0) { view.m = 11; view.y--; } load(); });
  $("next").addEventListener("click", () => { view.m++; if (view.m > 11) { view.m = 0; view.y++; } load(); });

  boot();
</script>
</body>
</html>
